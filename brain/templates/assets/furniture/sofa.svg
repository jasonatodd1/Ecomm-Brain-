<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 32" aria-hidden="true">
  <!--
    Standard 3-seat sofa  track-arm style, front elevation.
    viewBox units = inches (84?  32?). Back and seat span full width (0?84).
    Armrests: flat bottom on middle seam (y=14.8), rounded top, drawn above that line.
  -->
  <path fill="currentColor" d="
    M 0 28
    L 84 28
    L 84 14.8
    L 84 3
    Q 84 2.5 83 2.5
    L 1 2.5
    Q 0 2.5 0 3
    L 0 14.8
    Z
  "/>
  <rect fill="currentColor" x="2" y="28" width="3.2" height="3" rx="0.35"/>
  <rect fill="currentColor" x="30.4" y="28" width="3.2" height="3" rx="0.35"/>
  <rect fill="currentColor" x="50.4" y="28" width="3.2" height="3" rx="0.35"/>
  <rect fill="currentColor" x="78.8" y="28" width="3.2" height="3" rx="0.35"/>
  <path fill="none" stroke="currentColor" stroke-width="0.32" opacity="0.5"
        stroke-linecap="round"
        d="M 0 14.8 H 84 M 28 14.8 V 28 M 56 14.8 V 28"/>
  <!-- Armrests on middle seam: bottom flat at y=14.8, rounded top -->
  <path fill="currentColor" d="
    M 0 14.8
    L 0 9.8
    Q 0 8.2 1.4 8.2
    L 4.6 8.2
    Q 6 8.2 6 9.8
    L 6 14.8
    Z
  "/>
  <path fill="currentColor" d="
    M 78 14.8
    L 78 9.8
    Q 78 8.2 79.4 8.2
    L 82.6 8.2
    Q 84 8.2 84 9.8
    L 84 14.8
    Z
  "/>
</svg>
