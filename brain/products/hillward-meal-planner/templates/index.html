<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HillwardStudio Meal Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       HillwardStudio Meal Planner — v3
       One-page weekly meal grid + aisle-grouped grocery list.

       v3 changes vs v2:
         - Breakfast / Lunch / Dinner column headers centered (were
           left-aligned, which floated them off the visual center of
           the columns they label).
         - Footer separator rule REMOVED. Same hierarchy problem the v2
           aisle headers had: a structural divider that reads identical
           to the Notes section's writing lines just above it. v3 lets
           --footer-gap-above (now 7mm) + the muted stone color of the
           footer text itself carry the demarcation.

       v2 changes vs v1:
         - Mid-page dashed "tear-line" REMOVED. The tear-off positioning
           lives in listing copy / hero photo (the whole sheet tears off
           a pad). Putting a perforation IN the page implied tearing the
           page in half — which destroys the one-sheet workflow.
         - Aisle headers no longer use a honey rule above the label. The
           parallel honey-rule + writing-lines pattern read as a stack of
           similar horizontal lines and lost the section hierarchy. Bold
           uppercase typography + extra whitespace now carries the break.
         - Page size is now declared via @page (preferCSSPageSize: true)
           instead of Puppeteer's `format` param + manual margin — cleaner
           PDF output that opens reliably across Mac PDF readers.

       Asset spec locked by v5 brief cb213bf4.
       Required elements (do not remove):
         - 7-day meal grid (B/L/D)
         - Aisle-grouped grocery list: Produce / Proteins / Dairy /
           Pantry / Freezer / Other
         - Meal grid + grocery side-by-side on a single page
         - Week-start label visible
         - Notes strip
         - Print-friendly ink (hairline rules, no solid fills)

       Variants (set on <body> by Puppeteer pre-render):
         data-start="sun" | "mon"
         data-size="letter" | "a4"

       Puppeteer also injects a one-line <style> tag that sets
         @page { size: letter | A4; margin: 0 }
       so each variant gets the right physical page dimensions.
       ============================================================ */

    :root {
      /* Palette — HillwardStudio warm-neutral system.
         Honey is now reserved for the single week-start chip — one
         disciplined accent, instead of competing with the grocery
         writing lines. Everything else is grayscale-ish so ink
         coverage stays low. */
      --off-white:  #F7F5F2;
      --cream:      #EDE8E1;
      --sand:       #D6CFC4;
      --stone:      #A89F92;
      --slate:      #6B6357;
      --charcoal:   #2E2A26;
      --honey:      #C9B79C;

      --font:       'Inter', system-ui, -apple-system, sans-serif;
      --hairline:   0.5pt;
      --rule:       0.7pt;
      --rule-bold:  1.2pt;

      /* Page geometry — overridden for A4 below. Letter default. */
      --page-w:     215.9mm;  /* 8.5in */
      --page-h:     279.4mm;  /* 11in  */
      --margin-x:   12mm;
      --margin-y:   12mm;

      /* Two-column split — meal grid : grocery list. */
      --col-meal:    55%;
      --col-grocery: 45%;
      --col-gap:     9mm;

      /* Vertical rhythm */
      --header-gap-below: 7mm;
      --notes-gap-above:  6mm;
      --footer-gap-above: 7mm;  /* v3: was 4mm + a hairline rule +
                                   4mm padding-top. Rule removed; this
                                   gap is now the sole demarcation
                                   between the last notes write-on line
                                   and the muted footer microcopy. */
    }

    body[data-size="a4"] {
      --page-w: 210mm;
      --page-h: 297mm;
    }

    /* @page rule is injected at render time by the Puppeteer wrapper —
       see src/render/meal-planner.ts. Keeping it dynamic lets one
       template serve both Letter and A4 with a single page.pdf() call
       per variant and preferCSSPageSize: true. */

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: var(--font);
      color: var(--charcoal);
      font-weight: 400;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ============ Page chrome ============ */
    .page {
      width: var(--page-w);
      height: var(--page-h);
      padding: var(--margin-y) var(--margin-x);
      background: var(--off-white);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* ============ HEADER STRIP ============
       Wordmark · WEEK OF ______________ · [Sunday Start] */
    .header {
      display: flex;
      align-items: center;
      gap: 8mm;
      padding-bottom: 5mm;
      margin-bottom: var(--header-gap-below);
      border-bottom: var(--rule) solid var(--stone);
    }
    .wordmark {
      flex: 0 0 auto;
      font-size: 7.5pt;
      font-weight: 500;
      letter-spacing: 0.42em;
      color: var(--slate);
      text-transform: uppercase;
    }
    .week-of {
      flex: 1;
      display: flex;
      align-items: baseline;
      gap: 4mm;
      justify-content: center;
    }
    .week-of-label {
      font-size: 9.5pt;
      font-weight: 500;
      letter-spacing: 0.32em;
      color: var(--charcoal);
      text-transform: uppercase;
      white-space: nowrap;
    }
    .week-of-line {
      flex: 1 1 60mm;
      max-width: 80mm;
      height: var(--hairline);
      background: var(--slate);
    }
    .week-start-chip {
      flex: 0 0 auto;
      font-size: 7pt;
      font-weight: 500;
      letter-spacing: 0.32em;
      color: var(--charcoal);
      text-transform: uppercase;
      padding: 1.6mm 3.5mm 1.2mm;
      border: var(--hairline) solid var(--honey);
    }

    /* ============ TWO-COLUMN BODY ============
       Meal grid + Grocery, separated only by --col-gap whitespace.
       v1 had a dashed mid-page "tear-line" here — REMOVED in v2
       because it implied tearing the sheet in half, which destroys
       the one-sheet shop-with-it workflow that IS the wedge. The
       tear-off concept lives in listing copy + the hero photo (whole
       sheet tears off a pad), not on the printed page. */
    .body {
      flex: 1;
      display: flex;
      gap: var(--col-gap);
      min-height: 0;
    }

    /* Shared column label sits above each half — "Meals" / "Grocery — by aisle" */
    .col-label {
      font-size: 8.5pt;
      font-weight: 600;
      letter-spacing: 0.32em;
      color: var(--charcoal);
      text-transform: uppercase;
      padding-bottom: 3mm;
      margin-bottom: 4mm;
      border-bottom: var(--rule) solid var(--charcoal);
    }

    /* ============ MEAL GRID — 7 days × 3 meals (B/L/D) ============
       Day label is rotated 90° on the left edge — category convention
       (MyLifePlans + MarrMar both do this; iconic, frees horizontal
       space). Rows auto-balance to fill available height. */
    .meal-grid {
      flex: 0 0 var(--col-meal);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .meal-subheader {
      display: grid;
      grid-template-columns: 10mm 1fr 1fr 1fr;
      gap: 0;
      margin-bottom: 1.2mm;
    }
    .meal-subheader > div {
      font-size: 6.8pt;
      font-weight: 500;
      letter-spacing: 0.24em;
      color: var(--slate);
      text-transform: uppercase;
      text-align: center;
    }

    .meal-days {
      flex: 1;
      display: grid;
      grid-template-columns: 10mm 1fr 1fr 1fr;
      grid-template-rows: repeat(7, 1fr);
      border-top: var(--hairline) solid var(--stone);
      border-left: var(--hairline) solid var(--stone);
    }
    .day-cell {
      border-right: var(--hairline) solid var(--sand);
      border-bottom: var(--hairline) solid var(--sand);
      padding: 1.5mm 2mm;
      position: relative;
    }
    .day-label-cell {
      border-right: var(--hairline) solid var(--stone);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .day-label {
      font-size: 8pt;
      font-weight: 600;
      letter-spacing: 0.28em;
      color: var(--charcoal);
      text-transform: uppercase;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
    }
    /* Outer right + bottom borders darker for a clean frame */
    .meal-days .day-cell:nth-child(4n) { border-right-color: var(--stone); }
    .meal-days > :nth-last-child(-n+4) { border-bottom-color: var(--stone); }

    /* ============ GROCERY — aisle-grouped ============
       Six labeled stacks (Produce, Proteins, Dairy, Pantry, Freezer,
       Other), each with hairline-ruled write-on lines.

       v1 had a honey rule ABOVE each aisle label. Removed in v2: the
       parallel honey-rule + sand-writing-rules read as one stack of
       similar horizontal lines and lost the section hierarchy. v2
       carries the break with bold uppercase typography + extra
       whitespace between sections — the label visually owns its rows
       below without competing with them. */
    .grocery {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .grocery-aisles {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .aisle {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    /* Whitespace IS the section divider. Slightly larger than v1's 3mm
       to compensate for losing the honey rule as a visual break. */
    .aisle:not(:first-child) { margin-top: 5mm; }
    .aisle-label {
      font-size: 9pt;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: var(--charcoal);
      text-transform: uppercase;
      padding-bottom: 2mm;
    }
    .aisle-lines {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .aisle-line {
      flex: 1;
      border-bottom: var(--hairline) solid var(--sand);
      min-height: 4.5mm;
    }

    /* ============ NOTES strip (full-width bottom) ============
       Sits below both columns. Two lines is plenty for budget /
       leftover / reminder tracking without crowding the planning
       area above. */
    .notes {
      margin-top: var(--notes-gap-above);
      padding-top: 4mm;
      border-top: var(--rule) solid var(--stone);
      display: flex;
      flex-direction: column;
      gap: 2.5mm;
    }
    .notes-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    .notes-label {
      font-size: 8.5pt;
      font-weight: 600;
      letter-spacing: 0.32em;
      color: var(--charcoal);
      text-transform: uppercase;
    }
    .notes-sub {
      font-size: 6.5pt;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: var(--stone);
      text-transform: uppercase;
    }
    .notes-lines {
      display: grid;
      grid-template-rows: repeat(2, 1fr);
      min-height: 13mm;
    }
    .notes-line {
      border-bottom: var(--hairline) solid var(--sand);
    }

    /* ============ Footer ============ ============
       v2 had a hairline rule above the footer microcopy. Removed in v3
       for the same reason the honey aisle-rules were removed in v2: a
       structural divider that reads identical to the writing lines of
       the Notes section just above it. v3 lets the wider vertical gap
       (--footer-gap-above) + the muted stone color carry the
       demarcation. Stop adding lines that compete with elements that
       already look distinct. */
    .footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-top: var(--footer-gap-above);
      font-size: 6pt;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: var(--stone);
      text-transform: uppercase;
    }
  </style>
</head>

<body data-start="sun" data-size="letter">

  <div class="page">

    <!-- ========== HEADER STRIP ========== -->
    <header class="header">
      <div class="wordmark">HillwardStudio</div>
      <div class="week-of">
        <span class="week-of-label">Week of</span>
        <span class="week-of-line"></span>
      </div>
      <div class="week-start-chip">Sunday Start</div>
    </header>

    <!-- ========== TWO-COLUMN BODY ========== -->
    <div class="body">

      <!-- MEAL GRID -->
      <section class="meal-grid">
        <div class="col-label">Meals</div>
        <div class="meal-subheader">
          <div></div>
          <div>Breakfast</div>
          <div>Lunch</div>
          <div>Dinner</div>
        </div>
        <div class="meal-days" id="meal-days"></div>
      </section>

      <!-- GROCERY (aisle-grouped) -->
      <section class="grocery">
        <div class="col-label">Grocery — by aisle</div>
        <div class="grocery-aisles">
          <div class="aisle">
            <div class="aisle-label">Produce</div>
            <div class="aisle-lines" data-lines="5"></div>
          </div>
          <div class="aisle">
            <div class="aisle-label">Proteins</div>
            <div class="aisle-lines" data-lines="5"></div>
          </div>
          <div class="aisle">
            <div class="aisle-label">Dairy</div>
            <div class="aisle-lines" data-lines="5"></div>
          </div>
          <div class="aisle">
            <div class="aisle-label">Pantry</div>
            <div class="aisle-lines" data-lines="5"></div>
          </div>
          <div class="aisle">
            <div class="aisle-label">Freezer</div>
            <div class="aisle-lines" data-lines="5"></div>
          </div>
          <div class="aisle">
            <div class="aisle-label">Other</div>
            <div class="aisle-lines" data-lines="5"></div>
          </div>
        </div>
      </section>

    </div>

    <!-- ========== NOTES strip ========== -->
    <section class="notes">
      <div class="notes-header">
        <span class="notes-label">Notes</span>
        <span class="notes-sub">Budget · Leftovers · Reminders</span>
      </div>
      <div class="notes-lines">
        <div class="notes-line"></div>
        <div class="notes-line"></div>
      </div>
    </section>

    <!-- ========== Footer ========== -->
    <footer class="footer">
      <span>HillwardStudio · Personal Use</span>
      <span class="footer-meta">Weekly Meal Planner · Aisle-Grouped Grocery</span>
    </footer>

  </div>

  <script>
    /* Build the variant-dependent pieces:
         - 7 day rows in the order determined by data-start (sun | mon)
         - aisle write-on lines per [data-lines]
         - week-start chip label + footer meta sentence */
    (function build() {
      const body = document.body;
      const start = body.getAttribute('data-start') === 'mon' ? 'mon' : 'sun';

      const DAYS_SUN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const DAYS_MON = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      const days = start === 'mon' ? DAYS_MON : DAYS_SUN;

      const grid = document.getElementById('meal-days');
      const frag = document.createDocumentFragment();
      for (const d of days) {
        const labelWrap = document.createElement('div');
        labelWrap.className = 'day-cell day-label-cell';
        const label = document.createElement('span');
        label.className = 'day-label';
        label.textContent = d;
        labelWrap.appendChild(label);
        frag.appendChild(labelWrap);
        for (let i = 0; i < 3; i++) {
          const cell = document.createElement('div');
          cell.className = 'day-cell meal-cell';
          frag.appendChild(cell);
        }
      }
      grid.appendChild(frag);

      document.querySelectorAll('.aisle-lines').forEach(el => {
        const n = parseInt(el.getAttribute('data-lines') || '5', 10);
        for (let i = 0; i < n; i++) {
          const line = document.createElement('div');
          line.className = 'aisle-line';
          el.appendChild(line);
        }
      });

      const startLabel = start === 'mon' ? 'Monday Start' : 'Sunday Start';
      const chip = document.querySelector('.week-start-chip');
      if (chip) chip.textContent = startLabel;
      const meta = document.querySelector('.footer-meta');
      if (meta) {
        meta.textContent =
          `Weekly Meal Planner · Aisle-Grouped Grocery · ${startLabel}`;
      }
    })();
  </script>

</body>
</html>
