<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What's Included</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 2000px;
      height: 2000px;
      background: #EDE8E1;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-print-color-adjust: exact;
    }
    .container {
      width: 1600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 60px;
    }
    .eyebrow {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #6B6357;
    }
    .rule {
      width: 80px;
      height: 1px;
      background: #A89F92;
    }
    .title {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #2E2A26;
      text-align: center;
      line-height: 1.1;
    }
    .bunny-thumb {
      width: 500px;
      height: 667px;
      object-fit: cover;
      border-radius: 4px;
    }
    .sizes-label {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #6B6357;
    }
    .sizes {
      font-size: 44px;
      font-weight: 300;
      color: #2E2A26;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .divider {
      color: #C9B79C;
      margin: 0 20px;
    }
    .details {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .detail-item {
      font-size: 28px;
      font-weight: 400;
      color: #6B6357;
      letter-spacing: 0.1em;
    }
    .brand {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #A89F92;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">HillwardStudio</div>
    <div class="rule"></div>
    <div class="title">What's<br>Included</div>
    <img class="bunny-thumb" src="../dist/HillwardStudio-BunnyPrint-8x10.jpg" alt="Vintage Bunny Print">
    <div class="sizes-label">5 Print-Ready Sizes</div>
    <div class="sizes">
      8×10 <span class="divider">·</span> 11×14 <span class="divider">·</span> 16×20 <span class="divider">·</span> 18×24 <span class="divider">·</span> 24×36
    </div>
    <div class="details">
      <div class="detail-item">High-Resolution JPG Files</div>
      <div class="detail-item">Instant Digital Download</div>
    </div>
    <div class="rule"></div>
    <div class="brand">Vintage Bunny Nursery Print</div>
  </div>
</body>
</html>
