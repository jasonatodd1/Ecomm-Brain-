<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Size Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 2000px;
      height: 2000px;
      background: #EDE8E1;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-print-color-adjust: exact;
    }
    .container {
      width: 1800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    .eyebrow {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #6B6357;
    }
    .rule {
      width: 80px;
      height: 1px;
      background: #A89F92;
    }
    .title {
      font-size: 88px;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #2E2A26;
      text-align: center;
      line-height: 1.1;
    }
    .diagram-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .caption {
      font-size: 28px;
      font-weight: 400;
      color: #6B6357;
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.65;
      max-width: 1800px;
      white-space: nowrap;
    }
    .brand {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #A89F92;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="eyebrow">HillwardStudio</div>
    <div class="rule"></div>
    <div class="title">Size Guide</div>

    <div class="diagram-wrap">
      <!--
        Single scale: 13 px per inch (sofa + all frames).

        Sofa: 84″ × 32″ → 1092 × 416 px, centered; leg bottoms at y ≈ 928
        Frame row: shared bottom baseline y = 476 (48 px above sofa top)

        Frame sizes (portrait w×h inches → px):
          8×10  → 104×130
          11×14 → 143×182
          16×20 → 208×260
          18×24 → 234×312
          24×36 → 312×468

        Asset: templates/assets/furniture/sofa.svg (inlined below)
      -->
      <svg viewBox="0 0 1800 980" width="1800" height="980"
           xmlns="http://www.w3.org/2000/svg"
           aria-label="Five print sizes compared to a standard sofa">
        <defs>
          <style>
            .frame-rect {
              fill: rgba(107,127,94,0.14);
              stroke: #6B7F5E;
              stroke-width: 3.5;
            }
            .furniture {
              fill: rgba(107,127,94,0.14);
              stroke: #6B7F5E;
              stroke-width: 0.27;
              stroke-linejoin: round;
            }
            .furniture-detail {
              fill: none;
              stroke: #6B7F5E;
              stroke-width: 0.32;
              opacity: 0.55;
              stroke-linecap: round;
            }
            .lbl {
              font-family: 'Inter', sans-serif;
              font-weight: 500;
              fill: #3A3530;
              text-anchor: middle;
              dominant-baseline: middle;
            }
            .ref-label {
              font-family: 'Inter', sans-serif;
              font-weight: 400;
              fill: #8A7A6A;
              text-anchor: middle;
              dominant-baseline: middle;
            }
            .floor-line {
              stroke: #C4B49A;
              stroke-width: 2;
            }
          </style>
        </defs>

        <!-- Floor line at leg bottoms (viewBox y=31 → 524 + 31/32×416 ≈ 927) -->
        <line class="floor-line" x1="320" y1="928" x2="1480" y2="928"/>

        <!-- ═══ FRAMES (ascending left → right, shared baseline y = 476) ═══ -->

        <rect class="frame-rect" x="360" y="346" width="104" height="130" rx="4"/>
        <text class="lbl" font-size="22" x="412" y="404">8×10″</text>

        <rect class="frame-rect" x="484" y="294" width="143" height="182" rx="4"/>
        <text class="lbl" font-size="24" x="555" y="376">11×14″</text>

        <rect class="frame-rect" x="647" y="216" width="208" height="260" rx="4"/>
        <text class="lbl" font-size="26" x="751" y="334">16×20″</text>

        <rect class="frame-rect" x="875" y="164" width="234" height="312" rx="4"/>
        <text class="lbl" font-size="28" x="992" y="308">18×24″</text>

        <rect class="frame-rect" x="1129" y="8" width="312" height="468" rx="4"/>
        <text class="lbl" font-size="32" x="1285" y="226">24×36″</text>

        <!-- ═══ SOFA (templates/assets/furniture/sofa.svg) ═══ -->
        <svg x="354" y="524" width="1092" height="416" viewBox="0 0 84 32" aria-hidden="true">
          <path class="furniture" d="
            M 0 28
            L 84 28
            L 84 14.8
            L 84 3
            Q 84 2.5 83 2.5
            L 1 2.5
            Q 0 2.5 0 3
            L 0 14.8
            Z
          "/>
          <rect class="furniture" x="2" y="28" width="3.2" height="3" rx="0.35"/>
          <rect class="furniture" x="30.4" y="28" width="3.2" height="3" rx="0.35"/>
          <rect class="furniture" x="50.4" y="28" width="3.2" height="3" rx="0.35"/>
          <rect class="furniture" x="78.8" y="28" width="3.2" height="3" rx="0.35"/>
          <path class="furniture-detail" d="M 0 14.8 H 84 M 28 14.8 V 28 M 56 14.8 V 28"/>
          <path class="furniture" d="M 0 14.8 L 0 9.8 Q 0 8.2 1.4 8.2 L 4.6 8.2 Q 6 8.2 6 9.8 L 6 14.8 Z"/>
          <path class="furniture" d="M 78 14.8 L 78 9.8 Q 78 8.2 79.4 8.2 L 82.6 8.2 Q 84 8.2 84 9.8 L 84 14.8 Z"/>
        </svg>
        <text class="ref-label" font-size="24" x="900" y="968">Standard sofa · 84″ wide</text>
      </svg>
    </div>

    <div class="caption">
      Five sizes to fit any wall — see how each compares to a standard sofa for real-world scale.
    </div>
    <div class="rule"></div>
    <div class="brand">Vintage Bunny Nursery Print</div>
  </div>
</body>
</html>
