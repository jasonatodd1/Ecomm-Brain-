<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Size Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 2000px;
      height: 2000px;
      background: #EDE8E1;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-print-color-adjust: exact;
    }
    .container {
      width: 1600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
    }
    .eyebrow {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #6B6357;
    }
    .rule {
      width: 80px;
      height: 1px;
      background: #A89F92;
    }
    .title {
      font-size: 72px;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: #2E2A26;
      text-align: center;
      line-height: 1.1;
    }
    .diagram-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 8px 0 0;
    }
    .diagram-wrap svg {
      display: block;
    }
    .caption {
      font-size: 28px;
      font-weight: 400;
      color: #6B6357;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.55;
      max-width: 1100px;
    }
    .brand {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: #A89F92;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <!--
    Scale: 7 px per inch — all frame outlines and crib silhouette share one
    coordinate system so relative proportions are honest.
    Crib reference: ~53" wide × ~28" tall (standard full-size rail silhouette).
  -->
  <div class="container">
    <div class="eyebrow">HillwardStudio</div>
    <div class="rule"></div>
    <div class="title">Size<br>Guide</div>

    <div class="diagram-wrap">
      <svg width="920" height="620" viewBox="0 0 920 620" xmlns="http://www.w3.org/2000/svg" aria-label="Print size comparison with crib scale reference">
        <defs>
          <style>
            .frame {
              fill: none;
              stroke: #6B7F5E;
              stroke-width: 2.5;
            }
            .frame-inner {
              fill: rgba(107, 127, 94, 0.06);
              stroke: #6B7F5E;
              stroke-width: 2.5;
            }
            .label {
              font-family: 'Inter', sans-serif;
              font-size: 15px;
              font-weight: 500;
              fill: #2E2A26;
              letter-spacing: 0.08em;
            }
            .label-sub {
              font-family: 'Inter', sans-serif;
              font-size: 11px;
              font-weight: 400;
              fill: #6B6357;
              letter-spacing: 0.06em;
            }
            .crib-line {
              fill: none;
              stroke: #8A7A5C;
              stroke-width: 2.5;
              stroke-linecap: round;
              stroke-linejoin: round;
            }
            .crib-fill {
              fill: rgba(138, 122, 92, 0.08);
              stroke: #8A7A5C;
              stroke-width: 2.5;
              stroke-linejoin: round;
            }
            .floor {
              stroke: #C9B79C;
              stroke-width: 1;
              stroke-dasharray: 4 6;
            }
            .guide-text {
              font-family: 'Inter', sans-serif;
              font-size: 12px;
              font-weight: 400;
              fill: #A89F92;
              letter-spacing: 0.12em;
              text-transform: uppercase;
            }
          </style>
        </defs>

        <!-- Floor line -->
        <line class="floor" x1="60" y1="500" x2="860" y2="500" />

        <!-- Nested frames — shared bottom-left corner at (180, 500), 7 px/in -->
        <!-- 24×36 -->
        <rect class="frame" x="180" y="248" width="168" height="252" rx="2" />
        <text class="label" x="192" y="268">24×36″</text>
        <text class="label-sub" x="192" y="284">statement</text>

        <!-- 18×24 -->
        <rect class="frame" x="180" y="332" width="126" height="168" rx="2" />
        <text class="label" x="192" y="350">18×24″</text>

        <!-- 16×20 -->
        <rect class="frame" x="180" y="360" width="112" height="140" rx="2" />
        <text class="label" x="192" y="376">16×20″</text>

        <!-- 11×14 -->
        <rect class="frame" x="180" y="402" width="77" height="98" rx="2" />
        <text class="label" x="188" y="418">11×14″</text>

        <!-- 8×10 -->
        <rect class="frame-inner" x="180" y="430" width="56" height="70" rx="2" />
        <text class="label" x="188" y="446">8×10″</text>
        <text class="label-sub" x="188" y="460">shelf</text>

        <!-- Crib silhouette — 53×28 in at 7 px/in = 371×196, centered under 24×36 -->
        <!-- 24×36 center x = 180 + 84 = 264; crib center aligned -->
        <g transform="translate(78, 500)">
          <!-- mattress rail body -->
          <rect class="crib-fill" x="0" y="0" width="371" height="196" rx="6" />
          <!-- headboard -->
          <path class="crib-line" d="M 0 196 L 0 52 Q 0 28 28 28 L 48 28 Q 68 28 68 52 L 68 196" />
          <!-- footboard -->
          <path class="crib-line" d="M 371 196 L 371 52 Q 371 28 343 28 L 323 28 Q 303 28 303 52 L 303 196" />
          <!-- top rail -->
          <line class="crib-line" x1="68" y1="28" x2="303" y2="28" />
          <!-- vertical slats (simplified) -->
          <line class="crib-line" x1="110" y1="28" x2="110" y2="196" />
          <line class="crib-line" x1="148" y1="28" x2="148" y2="196" />
          <line class="crib-line" x1="186" y1="28" x2="186" y2="196" />
          <line class="crib-line" x1="224" y1="28" x2="224" y2="196" />
          <line class="crib-line" x1="262" y1="28" x2="262" y2="196" />
          <text class="guide-text" x="186" y="228" text-anchor="middle">standard crib · 53″ wide</text>
        </g>

        <!-- Height callouts on the right -->
        <g font-family="Inter, sans-serif">
          <line stroke="#C9B79C" stroke-width="1" x1="400" y1="248" x2="430" y2="248" />
          <line stroke="#C9B79C" stroke-width="1" x1="400" y1="500" x2="430" y2="500" />
          <line stroke="#C9B79C" stroke-width="1" x1="430" y1="248" x2="430" y2="500" />
          <text class="label-sub" x="442" y="378" transform="rotate(-90 442 378)">24×36 above crib</text>

          <line stroke="#C9B79C" stroke-width="1" x1="400" y1="430" x2="520" y2="430" />
          <line stroke="#C9B79C" stroke-width="1" x1="520" y1="430" x2="520" y2="500" />
          <text class="label-sub" x="528" y="472">8×10 shelf scale</text>
        </g>

        <!-- Legend -->
        <text class="guide-text" x="180" y="560">all sizes drawn to scale · 7 px = 1 inch</text>
      </svg>
    </div>

    <div class="caption">
      Five sizes to fit any wall — from a cozy 8×10 shelf piece to a 24×36 statement above the crib.
    </div>

    <div class="rule"></div>
    <div class="brand">Vintage Bunny Nursery Print</div>
  </div>
</body>
</html>
