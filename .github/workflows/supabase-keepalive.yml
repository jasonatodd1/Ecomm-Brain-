# Keeps the Supabase Free-tier project from auto-pausing after 7 days of inactivity.
# Requires repo secrets: SUPABASE_URL, SUPABASE_ANON_KEY
name: Supabase keepalive

on:
  schedule:
    # Mon + Thu at 12:00 UTC — safely under the 7-day inactivity window.
    - cron: '0 12 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secrets."
            exit 1
          fi
          curl -sfS "${SUPABASE_URL%/}/rest/v1/assets?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          echo ""
          echo "Supabase keepalive OK"
